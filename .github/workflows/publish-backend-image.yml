name: Publish backend image

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/publish-backend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  publish:
    name: Build and publish backend
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          IMAGE: ghcr.io/takajirou/angelicagenda-backend
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            backend

      - name: Push immutable and main tags
        env:
          IMAGE: ghcr.io/takajirou/angelicagenda-backend
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"

