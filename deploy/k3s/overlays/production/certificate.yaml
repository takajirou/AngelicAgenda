apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: replace@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api
spec:
  secretName: api-tls
  issuerRef:
    name: letsencrypt
    kind: Issuer
  dnsNames:
    - replace.example.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

