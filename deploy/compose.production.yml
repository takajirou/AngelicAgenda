name: angelic-agenda

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      AUTH_PEPPER_FILE: /run/secrets/auth_pepper
      X_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/x_session_encryption_key
      ANGELIC_ANGEL_BINARY_PATH: /usr/local/bin/angelic-angel
      ANGELIC_ANGEL_CONFIG_DIRECTORY: /tmp/angelic-angel
      WEBHOOK_BASE_URL: http://127.0.0.1:3000/webhooks/x/
      MAX_ACTIVE_X_SESSIONS: 20
    expose:
      - "3000"
    secrets:
      - postgres_password
      - auth_pepper
      - x_session_encryption_key
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      edge:
        gw_priority: 1
      database:

  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: app
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sync-postgres-password.sh:/usr/local/share/angelic-agenda/sync-postgres-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      edge:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  auth_pepper:
    file: ./secrets/auth_pepper
  x_session_encryption_key:
    file: ./secrets/x_session_encryption_key
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

volumes:
  postgres_data:

networks:
  edge:
  database:
    internal: true
