services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/app
      AUTH_PEPPER: ${AUTH_PEPPER:?AUTH_PEPPER is required}
      X_SESSION_ENCRYPTION_KEY: ${X_SESSION_ENCRYPTION_KEY:?X_SESSION_ENCRYPTION_KEY is required}
      ANGELIC_ANGEL_BINARY_PATH: /usr/local/bin/angelic-angel
      ANGELIC_ANGEL_CONFIG_DIRECTORY: /tmp/angelic-angel
      WEBHOOK_BASE_URL: http://127.0.0.1:3000/webhooks/x/
      MAX_ACTIVE_X_SESSIONS: 20
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/app?sslmode=disable
      PGWEB_LOCK_SESSION: "true"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
