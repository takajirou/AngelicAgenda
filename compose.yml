services:
  backend:
    build:
      context: ./backend
    command: npm run start:dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/app
      ANGELIC_SETUP_TOKEN: ${ANGELIC_SETUP_TOKEN:?ANGELIC_SETUP_TOKEN is required}
      ANGELIC_ANGEL_BINARY_PATH: /usr/local/bin/angelic-angel
      ANGELIC_ANGEL_CONFIG_PATH: /var/lib/angelic-angel/angelic-angel.toml
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:?WEBHOOK_ENDPOINT is required}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - angelic_angel_data:/var/lib/angelic-angel
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_node_modules:
  angelic_angel_data:
  postgres_data:
